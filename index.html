<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주술 문제 페이지</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      h1 {
        margin-top: 0;
      }

        border: 1px solid #9995;

        padding: 1rem 1.25rem;

      code {
        padding: 0.1rem 0.35rem;

        background: #8882;

  <body>
    <h1>주술 문제 페이지</h1>

      <p>
        이 파일(<code>index.html</code>)에 기존에 만들었던 문제 HTML 내용을 붙여 넣으면
        바로 웹페이지로 공개할 수 있습니다.
      </p>
      <p>화이팅 🔥 (SQLD / ADSP)</p>
    </div>

</html>
