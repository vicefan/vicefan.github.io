<!DOCTYPE html>
<html lang="ko">
<head meta charset="UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주술대백과 실전 퀴즈 시스템</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html { min-width: 320px; background: #121212; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; margin: 0; padding: clamp(12px, 3vw, 32px); }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: clamp(12px, 2vw, 18px); padding: clamp(18px, 4vw, 40px); width: min(100%, 720px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card > div:first-child { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
        .badge { display: inline-block; background: #0f172a; color: #38bdf8; padding: 5px 10px; border-radius: 6px; font-size: clamp(0.78rem, 1.5vw, 0.95rem); font-weight: bold; border: 1px solid #1e3a8a; }
        .score { flex: 0 0 auto; color: #4ade80; font-weight: bold; font-size: clamp(0.8rem, 1.6vw, 1rem); line-height: 1.5; text-align: right; }
        .question-title { font-size: clamp(0.9rem, 1.8vw, 1.1rem); color: #94a3b8; margin-bottom: 8px; }
        .question-body { font-size: clamp(1.15rem, 2.8vw, 1.65rem); font-weight: bold; color: #f1f5f9; margin-bottom: clamp(18px, 3vw, 28px); word-break: keep-all; overflow-wrap: anywhere; line-height: 1.4; }
        
        input[type="text"] { width: 100%; min-height: 52px; padding: 14px; font-size: 16px; background: #0f172a; border: 2px solid #334155; border-radius: 10px; color: white; margin-bottom: 12px; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #38bdf8; }

        .feedback { font-size: clamp(1rem, 2vw, 1.15rem); font-weight: bold; margin-bottom: 14px; padding: 12px; border-radius: 8px; text-align: center; display: none; }
        .feedback.correct { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
        .feedback.wrong { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }

        .answer-box { background: #0f172a; border-left: 4px solid #38bdf8; padding: clamp(14px, 2.5vw, 20px); border-radius: 0 8px 8px 0; margin-bottom: 16px; display: none; text-align: left; }
        .answer-spell { font-size: clamp(1.05rem, 2.2vw, 1.25rem); font-weight: bold; color: #38bdf8; margin-bottom: 6px; overflow-wrap: anywhere; }
        .answer-desc { font-size: clamp(0.9rem, 1.8vw, 1rem); color: #cbd5e1; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }

        button { border: none; color: white; min-height: 52px; padding: 14px 20px; font-size: 1rem; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; margin-bottom: 8px; touch-action: manipulation; }
        .btn-primary { background: #0284c7; }
        .btn-primary:active { background: #0369a1; }
        .btn-secondary { background: #475569; display: none; }
        .btn-secondary:active { background: #334155; }

        @media (max-width: 480px) {
            body { align-items: stretch; justify-content: flex-start; }
            .card { margin: auto 0; }
            .card > div:first-child { align-items: center; }
            .badge { max-width: 60%; }
            .score { max-width: 40%; }
        }

        @media (min-width: 768px) {
            .card { padding: 40px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div>
            <span class="badge" id="category">카테고리</span>
            <span class="score" id="scoreDisplay">맞힌 개수: 0 / 0</span>
        </div>
        <div class="question-title">Q. 다음 설명에 알맞은 주술을 입력하세요</div>
        <div class="question-body" id="question">질문 내용</div>
        
        <div id="inputArea">
            <input type="text" id="userInput" placeholder="주술을 입력하거나 키워드 적기..." autocomplete="off" onkeypress="handleKeyPress(event)">
            <button class="btn-primary" onclick="checkAnswer()">정답 제출 –</button>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="answer-box" id="answerBox">
            <div class="answer-spell" id="spellName">정답 주술</div>
            <div class="answer-desc" id="answerDesc">해설 내용</div>
        </div>

        <button class="btn-secondary" id="nextBtn" onclick="nextSpell()">다음 주술 –</button>
    </div>

    <script>
        const spells = [
			{
				cat: "ADsP ? 1과목",
				q: "빅데이터 분석 주제 유형 사분면 분류에 대한 주술",
				keywords: ["발루통화", "발로통화", "열대로 행방불명된 동생한테 발루통화", "열대로 행방불명된 동생한테 발로통화"],
				spell: "열대로 행방불명된 동생한테 발루통화",
				desc: "? 열(대상): 데이터 활용 대상의 다양성\n? 행(방식): 데이터 활용 방식의 다양성\n? 발: 새로운 가치/비즈니스 발견\n? 루: 솔루션 도출\n? 통: 통찰(Insight) 제공\n? 화: 비즈니스 최적화"
			},
            {
                cat: "ADsP ? 1과목",
                q: "지식전환 4단계(SECI 모델: 암묵지/형식지)를 외우는 서사형 주술",
                keywords: ["공표연내", "공표였네", "공표연네", "공표였내", "투표지 열어보니까 공표였네 묵묵묵한 형사 묵먹어", "투표지 열어보니까 공표였내 묵묵묵한 형사 묵먹어", "투표지 열어보니까 공표연네 묵묵묵한 형사 묵먹어", "투표지 열어보니까 공표연내 묵묵묵한 형사 묵먹어"],
                spell: "투표지 열어보니까 공표연내 묵묵묵한 형사 묵먹어",
                desc: "? 공 (공통화): 암묵지 → 암묵지 (묵)\n? 표 (표출화): 암묵지 → 형식지 (묵)\n? 연 (연결화): 형식지 → 형식지 (묵)\n? 내 (내면화): 형식지 → 암묵지 (묵먹어)\n* 총 묵 3개 + 형식/형사 + 마지막 암묵(묵먹어)"
            },
            {
                cat: "ADsP ? 1과목",
                q: "데이터 용량 단위 주술",
                keywords: ["폐지", "PEZY", "폐지 주우니까 데이터 커졌어", "PEZY 주우니까 데이터 커졌어"],
                spell: "폐지 주우니까 데이터 커졌어 (PEZY)",
                desc: "? P: Peta ($10^{15}$)\n? E: Exa ($10^{18}$)\n? Z: Zetta ($10^{21}$)\n? Y: Yotta ($10^{24}$)"
            },
            {
                cat: "ADsP ? 1과목",
                q: "상향식 접근 방식 중 하나의 주술",
                keywords: ["공정개심심", "디자인 사고하는 애들은 공정 개 심심해해"],
                spell: "디자인 사고하는 애들은 공정 개 심심해해",
                desc: "1. 공: 공감 (Empathize)\n2. 정: 정의 (Define)\n3. 개: 개념 도출/개발 (Ideate)\n4. 시: 시제품 제작 (Prototype)\n5. 시: 시험/테스트 (Test)"
            },
            {
                cat: "SQLD ? 1과목",
                q: "데이터베이스 표준 스키마 관련 주술",
                keywords: ["부부개념"],
                spell: "부부개념",
                desc: "? 부: 외**부** 스키마 (외부 사용자/응용 프로그램 관점의 서브 뷰)\n? 부: 내**부** 스키마 (물리적 저장 장치 관점의 데이터 구조)\n? 개념: **개념** 스키마 (조직 전체의 통합된 논리적 데이터 구조)"
            },
            {
                cat: "SQLD ? 1과목",
                q: "발생시점에 따른 엔터티 분류 관련 주술",
                keywords: ["시발기행종", "시발 기행종", "기행종"],
                spell: "시발 기행종",
                desc: "? 시발: '발'생 '시'점\n? 기: 기본 엔터티 (태초부터 존재)\n? 행: 행위 엔터티 (이력, 주문 등 변경 잦음)\n? 종: 중심 엔터티 (업무의 핵심 파생)"
            },
            {
                cat: "SQLD ? 1과목",
                q: "엔터티의 유무형 분류 체계 관련 주술",
                keywords: ["형 개 사유", "형개사유"],
                spell: "형 개 사유~",
                desc: "? 형: 유형 엔터티 (물리적 형태 있음, 사원·물품 등)\n? 개: 개념 엔터티 (물리적 형태 없음, 조직·보험상품 등)\n? 사유: 사건 엔터티 (업무 수행에 따라 발생, 주문·청구 등)"
            },
            {
                cat: "ADsP ? 3과목",
                q: "혼동행렬 주요 수식 관련 주술",
                keywords: ["113 112 443", "정재 특) 113 112 443", "정재특)113112443"],
                spell: "정재 특) 113 112 443",
                desc: "? 정밀도(113): $1 / (1 + 3)$\n? 재현율(112): $1 / (1 + 2)$\n? 특이도(443): $4 / (4 + 3)$\n++ 열 = 예측, 행 = 실측"
            },
            {
                cat: "ADsP ? 3과목",
                q: "F1 관련 주술",
                keywords: ["이정재는 F1 플레이어"],
                spell: "이정재는 F1 플레이어",
                desc: "? F1-Score = $2 \\times \\frac{\\text{정밀도} \\times \\text{재현율}}{\\text{정밀도} + \\text{재현율}}$"
            },
            {
                cat: "ADsP ? 3과목",
                q: "연관분석 관련 주술",
                keywords: ["지신향 NAAB", "지신향 naab"],
                spell: "지신향 NAAB",
                desc: "? 분자 공통: $P(A \\cap B)$\n? 지지도 분모: N (전체 개수)\n? 신뢰도 분모: A (조건 A의 확률)\n? 향상도 분모: A, B (A와 B 독립확률의 곱)"
            },
            {
                cat: "ADsP ? 3과목",
                q: "지니계수 관련 주술",
                keywords: ["지니야~ 제곱합 빼~", "지니야 제곱합 빼", "지니야제곱합빼"],
                spell: "지니야~ 제곱합 빼~",
                desc: "? 지니 불순도 = $1 - \\sum (확률의 제곱)$"
            }
        ];

        let currentIndex = 0;
        let totalAttempts = 0;
        let correctCount = 0;

        function showSpell(index) {
            const item = spells[index];
            document.getElementById('category').innerText = item.cat;
            document.getElementById('question').innerText = item.q;
            document.getElementById('userInput').value = "";
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('answerBox').style.display = 'none';
            document.getElementById('inputArea').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('scoreDisplay').innerText = `맞힌 개수: ${correctCount} / ${totalAttempts}`;
        }

        function checkAnswer() {
            const userVal = document.getElementById('userInput').value.trim().toLowerCase();
            if (!userVal) {
                alert("답을 입력해 주세요!");
                return;
            }

            totalAttempts++;
            const currentItem = spells[currentIndex];
            
            // 키워드 중 하나라도 포함되면 정답 처리
            let isMatched = currentItem.keywords.some(kw => userVal.includes(kw.toLowerCase()));

            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';

            if (isMatched) {
                correctCount++;
                feedback.className = "feedback correct";
                feedback.innerText = "– 정답입니다! 완벽해요.";
            } else {
                feedback.className = "feedback wrong";
                feedback.innerText = "? 틀렸습니다! 정답과 해설을 확인하세요.";
            }

            // 정답 및 해설 노출
            document.getElementById('spellName').innerText = "– 정답 주술: " + currentItem.spell;
            document.getElementById('answerDesc').innerText = currentItem.desc;
            document.getElementById('answerBox').style.display = 'block';
            
            // 입력창 숨기고 다음 버튼 활성화
            document.getElementById('inputArea').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'block';
            document.getElementById('scoreDisplay').innerText = `맞힌 개수: ${correctCount} / ${totalAttempts}`;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        }

        function nextSpell() {
            currentIndex = (currentIndex + 1) % spells.length;
            showSpell(currentIndex);
        }

        // 첫 카드 로드
        showSpell(0);
    </script>
</body>
</html>
